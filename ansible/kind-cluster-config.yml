kind : Cluster
apiVersion : kind.x-k8s.io/v1alpha4
name : nexvion-devops-kind-cluster

nodes :

  # Control Node
  - role: control-plane
    image: kindest/node:v1.31.0 # Pins a specific Kubernetes version
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true" # Labels the node for Ingress scheduling
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Worker Nodes

  - role: worker
    image: kindest/node:v1.31.0
  - role: worker
    image: kindest/node:v1.31.0
